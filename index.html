<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>С Днём Рождения, Любимый!</title>
    <style>
        /* Голубенький светлый фон */
        body {
            background-color: #e0f7fa; /* Нежный голубой цвет */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden; /* Чтобы стикеры не создавали прокрутку */
            position: relative;
        }

        /* Контейнер для контента */
        .card {
            background-color: rgba(255, 255, 255, 0.85);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
            z-index: 10; /* Чтобы карточка была поверх стикеров */
            position: relative;
        }

        h1 {
            color: #00796b;
            font-size: 24px;
            margin-bottom: 20px;
        }

        /* Стили для фото */
        .photo-container {
            width: 100%;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .photo-container img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Стили для кнопки */
        button {
            background-color: #4dd0e1;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(77, 208, 225, 0.4);
        }

        button:hover {
            background-color: #26c6da;
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(77, 208, 225, 0.6);
        }

        button:active {
            transform: translateY(1px);
        }

        /* Скрытый текст поздравления */
        #congrats-text {
            display: none;
            color: #d81b60; /* Розовый цвет для текста */
            font-size: 28px;
            font-weight: bold;
            margin-top: 20px;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Стили для плавающих стикеров */
        .sticker {
            position: absolute;
            font-size: 40px;
            z-index: 1;
            animation: float 6s ease-in-out infinite;
        }

        /* Разные позиции и задержки для стикеров */
        .s1 { top: 10%; left: 10%; animation-delay: 0s; }
        .s2 { top: 20%; right: 15%; animation-delay: 1s; font-size: 50px; }
        .s3 { bottom: 15%; left: 20%; animation-delay: 2s; }
        .s4 { bottom: 10%; right: 10%; animation-delay: 0.5s; font-size: 35px;}
        .s5 { top: 50%; left: 5%; animation-delay: 1.5s; }
        .s6 { top: 60%; right: 5%; animation-delay: 2.5s; }
        .s7 { top: 5%; left: 50%; animation-delay: 3s; }
        .s8 { bottom: 5%; left: 50%; animation-delay: 1.8s; }

        /* Анимация парения */
        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }
    </style>
</head>
<body>

    <!-- Фоновые стикеры -->
    <div class="sticker s1">🐱</div>
    <div class="sticker s2">🎂</div>
    <div class="sticker s3">🍰</div>
    <div class="sticker s4">😺</div>
    <div class="sticker s5">🧁</div>
    <div class="sticker s6">😸</div>
    <div class="sticker s7">🎉</div>
    <div class="sticker s8">🎈</div>

    <!-- Основная карточка -->
    <div class="card">
        <h1>С Днём Рождения, любимый! ❤️</h1>
        
        <div class="photo-container">
            <!-- Убедитесь, что фото называется photo.jpg и лежит в одной папке с этим файлом -->
            <img src="photo.jpg" alt="Наше фото">
        </div>

        <button id="btn" onclick="showCongrats()">Получить поздравление</button>
        
        <div id="congrats-text">Вы поздравлены!</div>
    </div>

    <script>
        function showCongrats() {
            // Скрываем кнопку
            var btn = document.getElementById('btn');
            btn.style.display = 'none';
            
            // Показываем текст
            var text = document.getElementById('congrats-text');
            text.style.display = 'block';

            // Добавляем эффект салюта из стикеров (опционально)
            createConfetti();
        }

        // Функция для создания маленького эффекта при нажатии
        function createConfetti() {
            const emojis = ['🎉', '🥳', '🎈', '🎂', '❤️'];
            for (let i = 0; i < 15; i++) {
                let el = document.createElement('div');
                el.innerText = emojis[Math.floor(Math.random() * emojis.length)];
                el.style.position = 'absolute';
                el.style.left = Math.random() * 100 + 'vw';
                el.style.top = '100vh';
                el.style.fontSize = (Math.random() * 20 + 20) + 'px';
                el.style.transition = 'transform 2s ease-out, opacity 2s';
                el.style.zIndex = 100;
                document.body.appendChild(el);

                // Анимация поднятия вверх
                setTimeout(() => {
                    el.style.transform = `translateY(-${window.innerHeight}px) rotate(${Math.random() * 360}deg)`;
                    el.style.opacity = 0;
                }, 10);

                // Удаление элемента
                setTimeout(() => {
                    el.remove();
                }, 2000);
            }
        }
    </script>
</body>
</html>
